services:
  - type: web
    name: pharmaguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: FRONTEND_URI
        sync: false          # Set to your Vercel URL e.g. https://pharmaguard.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
